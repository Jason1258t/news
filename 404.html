<!doctype html>
<html lang="ru">
    <head>
        <meta charset="utf-8" />
        <title>Перенаправление…</title>
        <script>
            // The app uses hash routing (/#/articles/...). A plain path such as
            // /articles/slug is not a file on GitHub Pages, so send it to the same route.
            location.replace("/#" + location.pathname + location.search);
        </script>
    </head>
    <body>
        <p>Перенаправление… <a href="/">На главную</a></p>
    </body>
</html>
