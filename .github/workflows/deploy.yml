name: Deploy

# Builds the site and publishes it to GitHub Pages (Settings → Pages → Source: GitHub Actions).
# Firebase web config comes from Actions variables, see README → Развертывание.
on:
    push:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read
    pages: write
    id-token: write

concurrency:
    group: pages
    cancel-in-progress: false

jobs:
    deploy:
        runs-on: ubuntu-latest
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        env:
            VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
            VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
            VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
            VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
            VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
            VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
            VITE_FIREBASE_MEASUREMENT_ID: ${{ vars.VITE_FIREBASE_MEASUREMENT_ID }}
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: npm
            # A build without the config would deploy a site that cannot load anything.
            - name: Check Firebase config
              run: |
                  missing=0
                  for name in VITE_FIREBASE_API_KEY VITE_FIREBASE_AUTH_DOMAIN VITE_FIREBASE_PROJECT_ID VITE_FIREBASE_APP_ID; do
                      if [ -z "${!name}" ]; then echo "::error::Actions variable $name is not set"; missing=1; fi
                  done
                  if [[ "$VITE_FIREBASE_PROJECT_ID" == demo-* ]]; then echo "::error::demo- project in production config"; missing=1; fi
                  exit $missing
            - run: npm ci
            - run: npm run build
            - uses: actions/configure-pages@v5
            - uses: actions/upload-pages-artifact@v3
              with:
                  path: dist
            - id: deployment
              uses: actions/deploy-pages@v4
